<section id="reseller-account" class="section">  
  <div class="container">  
    <h2>Flashbyte Reseller Account</h2>  
    <p>Create your reseller account or log in to your dashboard.</p>  <div class="card">  
  <h3>Create an Account</h3>  

  <form id="register-form">  
    <label for="reg-name">Full Name</label>  
    <input id="reg-name" type="text" required  
           placeholder="Enter your full name">  

    <label for="reg-phone">Phone Number</label>  
    <input id="reg-phone" type="tel" required  
           placeholder="Enter your phone number">  

    <label for="reg-email">Email Address</label>  
    <input id="reg-email" type="email" required  
           placeholder="Enter your email">  

    <label for="reg-password">Password</label>  
    <input id="reg-password" type="password"  
           minlength="8" required  
           placeholder="At least 8 characters">  

    <button class="btn" type="submit">  
      Register as Reseller  
    </button>  
  </form>  

  <p id="register-message" aria-live="polite"></p>  
</div>  

<div class="card">  
  <h3>Already Registered?</h3>  

  <form id="login-form">  
    <label for="login-email">Email Address</label>  
    <input id="login-email" type="email" required  
           placeholder="Enter your email">  

    <label for="login-password">Password</label>  
    <input id="login-password" type="password" required  
           placeholder="Enter your password">  

    <button class="btn" type="submit">Log In</button>  
  </form>  

  <p id="login-message" aria-live="polite"></p>  
</div>  

<div id="reseller-dashboard" class="card" hidden>  
  <h3>Welcome to Your Dashboard!</h3>  

  <p><strong>Name:</strong>  
    <span id="dashboard-name"></span>  
  </p>  

  <p><strong>Phone:</strong>  
    <span id="dashboard-phone"></span>  
  </p>  

  <p><strong>Your Agent Code:</strong>  
    <span id="dashboard-code"></span>  
  </p>  

  <button class="btn" id="logout-button" type="button">  
    Log Out  
  </button>  
</div>


  </div>  
</section>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>  
const SUPABASE_URL = "https://vhinzztwuwuvtovbsils.supabase.co";  
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HOODfnqrvDSnmv28QpcO-g_buvaiudK";  
  
const db = window.supabase.createClient(  
  SUPABASE_URL,  
  SUPABASE_PUBLISHABLE_KEY  
);  
  
const registerForm = document.getElementById("register-form");  
const loginForm = document.getElementById("login-form");  
const dashboard = document.getElementById("reseller-dashboard");  
  
function showMessage(id, message) {  
  document.getElementById(id).textContent = message;  
}  
  
function generateAgentCode() {  
  const numbers = new Uint32Array(1);  
  crypto.getRandomValues(numbers);  
  
  return "FB" + String(numbers[0] % 100000000).padStart(8, "0");  
}  
  
async function loadDashboard() {  
  const { data: sessionData, error: sessionError } =  
    await db.auth.getSession();  
  
  if (sessionError) throw sessionError;  
  
  const user = sessionData.session?.user;  
  
  if (!user) {  
    dashboard.hidden = true;  
    return;  
  }  
  
  let { data: profile, error } = await db  
    .from("resellers")  
    .select("full_name, phone, agent_code")  
    .eq("User_id", user.id)  
    .maybeSingle();  
  
  if (error) throw error;  
  
  // Create the reseller profile on their first confirmed login.  
  if (!profile) {  
    const fullName = user.user_metadata?.full_name || "Reseller";  
    const phone = user.user_metadata?.phone || "";  
  
    let created = false;  
  
    for (let attempt = 0; attempt < 5; attempt++) {  
      const newProfile = {  
        "User_id": user.id,  
        full_name: fullName,  
        phone: phone,  
        agent_code: generateAgentCode()  
      };  
  
      const result = await db  
        .from("resellers")  
        .insert(newProfile)  
        .select("full_name, phone, agent_code")  
        .single();  
  
      if (!result.error) {  
        profile = result.data;  
        created = true;  
        break;  
      }  
  
      // Retry if the generated agent code already exists.  
      if (result.error.code !== "23505") {  
        throw result.error;  
      }  
    }  
  
    if (!created) {  
      throw new Error(  
        "Could not generate an available agent code. Please try again."  
      );  
    }  
  }  
  
  document.getElementById("dashboard-name").textContent =  
    profile.full_name;  
  
  document.getElementById("dashboard-phone").textContent =  
    profile.phone;  
  
  document.getElementById("dashboard-code").textContent =  
    profile.agent_code;  
  
  dashboard.hidden = false;  
}  
  
// Register a new reseller.  
registerForm.addEventListener("submit", async function(event) {  
  event.preventDefault();  
  
  const button = registerForm.querySelector('button[type="submit"]');  
  button.disabled = true;  
  
  showMessage("register-message", "Creating your account...");  
  
  try {  
    const fullName =  
      document.getElementById("reg-name").value.trim();  
  
    const phone =  
      document.getElementById("reg-phone").value.trim();  
  
    const email =  
      document.getElementById("reg-email").value.trim();  
  
    const password =  
      document.getElementById("reg-password").value;  
  
    const { data, error } = await db.auth.signUp({  
      email: email,  
      password: password,  
      options: {  
        data: {  
          full_name: fullName,  
          phone: phone  
        }  
      }  
    });  
  
    if (error) throw error;  
  
    if (data.session) {  
      await loadDashboard();  
  
      showMessage(  
        "register-message",  
        "Registration successful! Your reseller dashboard is ready."  
      );  
    } else {  
      showMessage(  
        "register-message",  
        "Account created! Check your email and confirm your address. Then log in to finish setting up your reseller profile."  
      );  
    }  
  } catch (error) {  
    showMessage("register-message", error.message);  
  } finally {  
    button.disabled = false;  
  }  
});  
  
// Log in an existing reseller.  
loginForm.addEventListener("submit", async function(event) {  
  event.preventDefault();  
  
  const button = loginForm.querySelector('button[type="submit"]');  
  button.disabled = true;  
  
  showMessage("login-message", "Logging in...");  
  
  try {  
    const email =  
      document.getElementById("login-email").value.trim();  
  
    const password =  
      document.getElementById("login-password").value;  
  
    const { error } = await db.auth.signInWithPassword({  
      email: email,  
      password: password  
    });  
  
    if (error) throw error;  
  
    await loadDashboard();  
  
    showMessage("login-message", "You are logged in successfully!");  
  } catch (error) {  
    showMessage("login-message", error.message);  
  } finally {  
    button.disabled = false;  
  }  
});  
  
// Log out.  
document.getElementById("logout-button")  
  .addEventListener("click", async function() {  
    const { error } = await db.auth.signOut();  
  
    if (error) {  
      showMessage("login-message", error.message);  
      return;  
    }  
  
    dashboard.hidden = true;  
    showMessage("login-message", "You have logged out.");  
  });  
  
// Restore the dashboard when a logged-in user revisits the site.  
(async function() {  
  try {  
    await loadDashboard();  
  } catch (error) {  
    console.error("Dashboard error:", error.message);  
  }  
})();  
</script> 
<!-- FLASHBYTE ADMIN DASHBOARD -->
<section id="admin-dashboard" class="section" hidden>
  <div class="container">
    <h2>Flashbyte Admin Dashboard</h2>
    <p>Welcome, Administrator!</p>

    <div class="card">
      <h3>Reseller Management</h3>
      <button class="btn" id="load-resellers" type="button">
        View Registered Resellers
      </button>
      <p id="admin-message" aria-live="polite"></p>
      <div id="reseller-list"></div>
    </div>
  </div>
</section>

<script>
(async function () {
  const section = document.getElementById("admin-dashboard");
  const message = document.getElementById("admin-message");
  const button = document.getElementById("load-resellers");
  const list = document.getElementById("reseller-list");

  try {
    const { data, error } = await db.auth.getUser();

    if (error) throw error;

    if (!data.user) {
      message.textContent = "Please log in first.";
      return;
    }

    const { data: admin, error: adminError } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if (adminError) throw adminError;

    if (!admin) {
      message.textContent =
        "Access denied. This account is not an administrator.";
      return;
    }

    section.hidden = false;
    message.textContent = "Administrator access verified.";
  } catch (error) {
    message.textContent = "Could not verify administrator access: " +
      error.message;
  }

  button.addEventListener("click", async function () {
    button.disabled = true;
    message.textContent = "Loading resellers...";
    list.replaceChildren();

    try {
      const { data: resellers, error } = await db
        .from("resellers")
        .select("full_name, phone, agent_code, created_at")
        .order("created_at", { ascending: false });

      if (error) throw error;

      if (!resellers || resellers.length === 0) {
        message.textContent = "No resellers found.";
        return;
      }

      for (const reseller of resellers) {
        const card = document.createElement("div");
        card.className = "card";

        const name = document.createElement("p");
        name.textContent = "Name: " + (reseller.full_name || "Not provided");

        const phone = document.createElement("p");
        phone.textContent = "Phone: " + (reseller.phone || "Not provided");

        const code = document.createElement("p");
        code.textContent = "Agent Code: " + reseller.agent_code;

        card.append(name, phone, code);
        list.appendChild(card);
      }

      message.textContent = "Resellers loaded successfully.";
    } catch (error) {
      message.textContent =
        "Could not load resellers. Database permissions may need updating.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>  
</html>
